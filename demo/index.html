<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ha-tplink-card — offline demo</title>
    <style>
      body {
        margin: 0;
        background: #09111e;
        font:
          14px Arial,
          sans-serif;
        color: #d6eaf2;
      }
      header {
        height: 66px;
        background: #0d1b2b;
        border-bottom: 1px solid #294259;
        display: flex;
        align-items: center;
        gap: 22px;
        padding: 0 30px;
        font-size: 18px;
      }
      header b {
        color: white;
      }
      main {
        display: grid;
        grid-template-columns: 220px minmax(0, 1fr);
        gap: 24px;
        padding: 28px 40px 30px 20px;
        max-width: 1500px;
        margin: auto;
      }
      nav {
        padding: 14px 15px;
        color: #92acba;
      }
      nav p {
        padding: 12px 17px;
        border-radius: 10px;
      }
      nav .active {
        background: #164548;
        color: #64f1d9;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 17px;
      }
      #card {
        display: block;
        width: 100%;
        max-width: 1100px;
      }
      small.muted {
        color: #8dabbb;
        font-size: 12px;
      }
      @media (max-width: 850px) {
        main {
          display: block;
          padding: 16px;
        }
        nav {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header><b>⌂ Home Assistant</b> &nbsp; Voorbeeld dashboard</header>
    <main>
      <nav>
        <p>⌂ &nbsp; Overzicht</p>
        <p class="active">◈ &nbsp; Netwerk</p>
        <p>ϟ &nbsp; Energie</p>
        <p>◎ &nbsp; Klimaat</p>
        <p>⚙ &nbsp; Instellingen</p>
      </nav>
      <section>
        <h1>
          Netwerk
          <small class="muted">ha-tplink-card · voorbeeldgegevens</small>
        </h1>
        <tplink-deco-mesh-card id="card"></tplink-deco-mesh-card>
      </section>
    </main>
    <script type="module" src="../dist/tplink-deco-mesh-card.js"></script>
    <script type="module" src="./demo.js"></script>
  </body>
</html>
