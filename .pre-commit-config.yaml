repos:
  - repo: local
    hooks:
      - id: whitespace
        name: Staged whitespace
        entry: git diff --cached --check
        language: system
        pass_filenames: false
        always_run: true
      - id: project-checks
        name: Lint, formatting, package validation and unit tests
        entry: npm run check
        language: system
        pass_filenames: false
        always_run: true
