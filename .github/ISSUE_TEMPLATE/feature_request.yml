name: Feature request
description: Suggest an improvement to the ha-tplink-card dashboard card.
labels:
  - enhancement
body:
  - type: textarea
    id: use-case
    attributes:
      label: What are you trying to do?
      description: Describe the task and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe how the card should behave and whether the change is for desktop, mobile, or both.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Extra context
      description: Include alternatives, mockups, or any relevant entities from the TP-Link Deco integration.
